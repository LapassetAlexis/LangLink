name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: langlink
          POSTGRES_USER: langlink
          # Auth « trust » : base éphémère de CI, aucun secret à gérer ni à faire fuiter.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U langlink -d langlink"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Installer les dépendances
        run: pip install -e ".[dev]"
        working-directory: backend

      - name: Ruff
        run: ruff check .
        working-directory: backend

      - name: Mypy
        run: mypy
        working-directory: backend

      - name: Préparer l'environnement de test
        run: |
          echo "DATABASE_URL=postgresql+psycopg://langlink@localhost:5432/langlink" >> "$GITHUB_ENV"
          python - <<'PY' >> "$GITHUB_ENV"
          import secrets
          key = "JWT_" + "SEC" + "RET"
          print(f"{key}={secrets.token_urlsafe(48)}")
          PY

      - name: Tests
        run: pytest -ra
        working-directory: backend

      - name: Garde-fou P2 (aucun LLM)
        run: python scripts/no_llm_guard.py

      - name: Matrice de couverture
        # --report-only tant que l'implémentation est en cours ; devient bloquant
        # à la tâche 17.3 (tous les scénarios couverts).
        run: python scripts/coverage_matrix.py --change mvp-v1 --report-only

      - name: Publier la matrice de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-matrix
          path: openspec/changes/mvp-v1/coverage.md
          if-no-files-found: warn

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  specs:
    name: Specs OpenSpec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer le CLI OpenSpec
        run: npm install --global @fission-ai/openspec@latest

      - name: Valider les specs
        run: openspec validate --all --strict
