# Catalogue statique de questions brise-glace (aucune génération automatique).
# Une question par entrée, en français et en anglais. La catégorie correspond à celle du
# référentiel d'intérêts ; une question est choisie de façon déterministe à la création du
# match, puis persistée (elle ne change plus jamais).
Jeux vidéo:
  - fr: "À quel jeu as-tu le plus joué cette année, et pourquoi celui-là ?"
    en: "Which game have you played the most this year, and why that one?"
  - fr: "Préfères-tu jouer seul ou en équipe ? Qu'est-ce que ça change pour toi ?"
    en: "Do you prefer playing solo or in a team? What does it change for you?"
  - fr: "Quel jeu t'a fait découvrir un genre que tu n'aimais pas ?"
    en: "Which game got you into a genre you thought you disliked?"
  - fr: "Quelle est ta plus belle anecdote de partie en ligne ?"
    en: "What is your best story from an online match?"
  - fr: "Tu joues plutôt le soir tard ou le week-end ?"
    en: "Do you usually play late at night or at weekends?"
  - fr: "Un jeu que tu voudrais faire découvrir à tout le monde ?"
    en: "A game you wish everyone would try?"

Cinéma & Séries:
  - fr: "Quel film t'a marqué au point d'y repenser des jours après ?"
    en: "Which film stayed with you for days afterwards?"
  - fr: "Série à binge-watcher ou film d'une soirée : qu'est-ce que tu préfères ?"
    en: "Binge-worthy series or a one-evening film: which do you prefer?"
  - fr: "Quel acteur ou actrice te ferait regarder n'importe quoi ?"
    en: "Which actor would make you watch anything?"
  - fr: "Un film que tout le monde adore et que tu n'as pas aimé ?"
    en: "A film everyone loves that you did not enjoy?"
  - fr: "Quel est le dernier film qui t'a fait pleurer ou rire aux éclats ?"
    en: "What was the last film that made you cry or laugh out loud?"
  - fr: "Tu regardes en version originale sous-titrée ?"
    en: "Do you watch in the original language with subtitles?"

Musique:
  - fr: "Quel morceau passes-tu en boucle en ce moment ?"
    en: "Which track are you playing on repeat right now?"
  - fr: "Le premier concert de ta vie, c'était qui ?"
    en: "Who was the first concert you ever went to?"
  - fr: "Quelle chanson te met de bonne humeur à coup sûr ?"
    en: "Which song reliably puts you in a good mood?"
  - fr: "Tu écoutes plutôt en albums entiers ou en playlists ?"
    en: "Do you listen to whole albums or playlists?"
  - fr: "Un artiste de ton pays que tu aimerais faire connaître ?"
    en: "An artist from your country you would like people to discover?"
  - fr: "Quel instrument aimerais-tu savoir jouer ?"
    en: "Which instrument would you love to be able to play?"

Cuisine:
  - fr: "Quel est ton plat réconfort, celui que tu cuisines quand ça ne va pas ?"
    en: "What is your comfort dish, the one you cook when things are hard?"
  - fr: "Une recette de famille que tu sais faire les yeux fermés ?"
    en: "A family recipe you can make with your eyes closed?"
  - fr: "Qu'est-ce que tu ne sais absolument pas cuisiner ?"
    en: "What can you absolutely not cook?"
  - fr: "Le meilleur repas que tu aies mangé hors de chez toi ?"
    en: "The best meal you have eaten away from home?"
  - fr: "Sucré ou salé au petit-déjeuner ?"
    en: "Sweet or savoury for breakfast?"
  - fr: "Un ingrédient que tu mettrais partout ?"
    en: "An ingredient you would put in everything?"

Voyage:
  - fr: "Quel voyage t'a le plus changé ?"
    en: "Which trip changed you the most?"
  - fr: "Ville ou nature : où tu recharges vraiment ?"
    en: "City or countryside: where do you actually recharge?"
  - fr: "Un endroit que tu rêves de voir avant tout le reste ?"
    en: "One place you dream of seeing before anything else?"
  - fr: "Tu voyages plutôt organisé ou à l'aventure ?"
    en: "Do you travel planned or spontaneously?"
  - fr: "Quelle coutume locale t'a le plus surpris ?"
    en: "Which local custom surprised you the most?"
  - fr: "Le pire trajet de ta vie, et tu en ris encore ?"
    en: "The worst journey of your life that you still laugh about?"

Lecture:
  - fr: "Quel livre t'a fait changer d'avis sur quelque chose ?"
    en: "Which book changed your mind about something?"
  - fr: "Tu lis papier, numérique ou audio ?"
    en: "Do you read paper, digital or audio?"
  - fr: "Un livre que tu as abandonné sans regret ?"
    en: "A book you abandoned without regret?"
  - fr: "Quel personnage de fiction te ressemble le plus ?"
    en: "Which fictional character is most like you?"
  - fr: "Le livre que tu offres le plus souvent ?"
    en: "The book you give away most often?"
  - fr: "Tu lis plusieurs livres à la fois ou un seul ?"
    en: "Do you read several books at once or just one?"

Arts:
  - fr: "Qu'est-ce qui te fait arrêter devant une œuvre ?"
    en: "What makes you stop in front of a piece of art?"
  - fr: "Tu crées toi-même quelque chose en ce moment ?"
    en: "Are you creating something yourself right now?"
  - fr: "Un musée ou une expo qui t'a marqué ?"
    en: "A museum or exhibition that marked you?"
  - fr: "Quelle discipline artistique t'intimide le plus ?"
    en: "Which art form intimidates you the most?"
  - fr: "Tu préfères dessiner, écrire ou photographier ?"
    en: "Do you prefer drawing, writing or photographing?"
  - fr: "Quelle œuvre aimerais-tu avoir chez toi ?"
    en: "Which artwork would you love to own?"

Sports:
  - fr: "Quel sport te vide la tête le plus vite ?"
    en: "Which sport clears your head fastest?"
  - fr: "Tu préfères pratiquer ou regarder ?"
    en: "Do you prefer playing or watching?"
  - fr: "Une performance sportive qui t'a impressionné ?"
    en: "A sporting performance that impressed you?"
  - fr: "Comment tu motives quand tu n'as pas envie de bouger ?"
    en: "How do you get motivated when you do not feel like moving?"
  - fr: "Un sport que tu aimerais essayer cette année ?"
    en: "A sport you would like to try this year?"
  - fr: "Le sport t'a appris quoi sur toi ?"
    en: "What has sport taught you about yourself?"

Technologies:
  - fr: "Quel outil t'a fait gagner le plus de temps cette année ?"
    en: "Which tool saved you the most time this year?"
  - fr: "Tu bricoles un projet en ce moment ? Raconte."
    en: "Are you tinkering with a project right now? Tell me."
  - fr: "Quelle techno t'intimide encore un peu ?"
    en: "Which technology still intimidates you a little?"
  - fr: "Le truc que tu automatiserais bien dans ta journée ?"
    en: "What would you love to automate in your day?"
  - fr: "Tu préfères comprendre comment ça marche ou que ça marche ?"
    en: "Do you prefer understanding how it works, or that it just works?"
  - fr: "Une découverte tech qui t'a vraiment surpris ?"
    en: "A tech discovery that genuinely surprised you?"

Nature & Animaux:
  - fr: "Quel animal te fascine, et pourquoi ?"
    en: "Which animal fascinates you, and why?"
  - fr: "Le meilleur endroit où tu as marché cette année ?"
    en: "The best place you walked this year?"
  - fr: "Tu as un jardin, un balcon ou juste des plantes d'intérieur ?"
    en: "Do you have a garden, a balcony, or just indoor plants?"
  - fr: "Quelle saison te ressemble le plus ?"
    en: "Which season is most like you?"
  - fr: "Un geste simple que tu fais pour la planète ?"
    en: "One simple thing you do for the planet?"
  - fr: "La dernière fois que tu as vraiment levé les yeux au ciel ?"
    en: "When did you last really look up at the sky?"
